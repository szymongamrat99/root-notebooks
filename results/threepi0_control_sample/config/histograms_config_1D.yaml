# Fiducial volumes: nazwa -> wyrażenie (dodatkowy filtr). Zmienna wskazuje je kluczem
# `fiducial_volume: nazwa` (lub listą nazw, łączone przez &&).
fiducial_volumes:
  omega: "rho_pm_closest < 2.0 && rho_00_closest < 1.5 && abs(z_pm_closest) < 2.0 && abs(z_00_closest) < 2.0"
  close_tracks: "rho_pm_00 < 2.05 && abs(z_pm_00) < 2.45"
histograms_1d:
  Emiss:
    title: 'Missing energy'
    unit: 'MeV'
    range_x:
      full:
        - -200
        - 200
      zoom:
        - -20
        - 20
    resolution: 1.0
  Pmiss:
    title: 'Missing momentum'
    unit: 'MeV/c'
    range_x:
      full:
        - 0.0
        - 500.0
      zoom:
        - 0.0
        - 20.0
    resolution: 1.0
  MissDiff:
    title: 'Missing invariant mass'
    unit: 'MeV/c^{2}'
    range_x:
      full:
        - 0
        - 200
      zoom:
        - 0
        - 20
    resolution: 1.0
  KchrecKS_5:
    title: m^{inv}_{+-,1} - m_{K^{0}}
    unit: MeV/c^{2}
    range_x:
      full:
        - -200
        - 200
      zoom:
        - -15
        - 15
    resolution: False
  KchrecKL_5:
    title: m^{inv}_{+-,2} - m_{K^{0}}
    unit: MeV/c^{2}
    range_x:
